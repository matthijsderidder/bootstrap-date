<!DOCTYPE html>
<html lang="nl" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Date</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../dist/css/bootstrap-date.min.css">
</head>
<body>
  <div class="container p-4">
    <h1 class="h3 mb-3">Bootstrap Date</h1>
    <form class="col-md-6">
      <label class="form-label" for="date-input">Date</label>
      <input type="date" class="form-control bs-date" id="date-input" lang="nl">
    </form>
  </div>
  <script src="../dist/js/bootstrap-date.min.js"></script>
</body>
</html>
